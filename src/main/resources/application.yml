spring:
  application:
    name: feedline

  datasource:
    url: jdbc:postgresql://localhost:5432/feedline
    username: feedline
    password: feedline
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: ${feed.outbox.send-timeout-ms:5000}
        request.timeout.ms: 2000
        retries: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,pollCycleHeartbeat
  health:
    sources:
      enabled: false

feed:
  # Project URL for User-Agent header: Feedline/0.1 (+<feedline.user-agent-url>)
  user-agent-url: https://github.com/kopekijay11-hub/feedline

  # Connect and read timeouts
  connect-timeout: 5s
  read-timeout: 15s

  # Maximum response body size (5 MB default)
  max-body-bytes: 5242880

  # Minimum interval between requests to the same origin (default 1000 ms)
  per-host-interval: 1000ms

  # Maximum retries for network errors and HTTP 5xx (default 3)
  max-retries: 3

  # Maximum redirects to follow (default 3)
  max-redirects: 3

  # SSRF guard: loopback targets are blocked by default. Local stub-server tests
  # override this explicitly; production must leave it false.
  ssrf-allow-loopback: false

  # Set false for workers/tests that invoke poller.pollOnce() directly; readiness
  # will not wait for a scheduled heartbeat in that mode.
  scheduling-enabled: true

  # How long to retain per-item ingest skip records.
  skip-retention: 30d

  # Fixed delay between polling cycles
  poll-delay: "60000"
  content-freshness-threshold: 7d

  outbox:
    enabled: true
    topic: feedline.items.ingested
    poll-delay: 2000
    batch-size: 50
    max-attempts: 5
    initial-backoff-ms: 1000
    max-backoff-ms: 60000
    send-timeout-ms: 5000
    cleanup:
      enabled: true
      published-retention: 7d
      batch-size: 500
      cron: "0 0 * * * *"

  admin:
    enabled: true
    api-key: ${FEED_ADMIN_API_KEY:feedline-admin-dev-token}
    header-name: X-Admin-Token

  # Feed sources
  sources:
    - name: BBC News World
      url: https://feeds.bbci.co.uk/news/world/rss.xml
      enabled: true
    - name: The Verge
      url: https://www.theverge.com/rss/index.xml
      enabled: true
    - name: Yahoo News Top Stories
      url: https://news.yahoo.com/rss/topstories
      enabled: true
    - name: MarketWatch Top Stories
      url: https://feeds.content.dowjones.io/public/rss/mw_topstories
      enabled: true
    - name: Bloomberg Markets
      url: https://feeds.bloomberg.com/markets/news.rss
      enabled: true
    - name: Investing.com News
      url: https://www.investing.com/rss/news.rss
      enabled: true
    - name: FXStreet News
      url: https://www.fxstreet.com/rss
      enabled: true
    - name: Federal Reserve Press Releases
      url: https://www.federalreserve.gov/feeds/press_all.xml
      enabled: true
    - name: Bank of Canada Press Releases
      url: https://www.bankofcanada.ca/content_type/press-releases/feed/
      enabled: true
    - name: CNBC Top News
      url: https://www.cnbc.com/id/100003114/device/rss/rss.html
      enabled: true

logging:
  level:
    ca.feedline: DEBUG
    org.springframework.jdbc: WARN
    org.flywaydb: WARN
