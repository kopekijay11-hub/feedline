spring:
  application:
    name: feedline

  lifecycle:
    # Bounded window for in-flight poll/outbox work during graceful shutdown.
    timeout-per-shutdown-phase: 30s

  task:
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: 30s

  datasource:
    url: jdbc:postgresql://localhost:5432/feedline
    username: feedline
    password: feedline
    driver-class-name: org.postgresql.Driver
    hikari:
      # Bounded pool for constrained hosts; override with DB_POOL_MAX_SIZE.
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: ${feed.outbox.send-timeout-ms:5000}
        request.timeout.ms: 2000
        retries: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,pollCycleHeartbeat
  health:
    sources:
      enabled: false

server:
  # Let in-flight web requests finish; the poller/relay have their own bounded
  # shutdown hooks in addition to this.
  shutdown: graceful

feed:
  # Project URL for User-Agent header: Feedline/0.1 (+<feedline.user-agent-url>)
  user-agent-url: https://github.com/kopekijay11-hub/feedline

  # Connect and read timeouts
  connect-timeout: 5s
  read-timeout: 15s

  # Maximum response body size (5 MB default)
  max-body-bytes: 5242880

  # Minimum interval between requests to the same origin (default 1000 ms)
  per-host-interval: 1000ms

  # Maximum retries for network errors and HTTP 5xx (default 3)
  max-retries: 3

  # Maximum redirects to follow (default 3)
  max-redirects: 3

  # SSRF guard: loopback targets are blocked by default. Local stub-server tests
  # override this explicitly; production must leave it false.
  ssrf-allow-loopback: false

  # Set false for workers/tests that invoke poller.pollOnce() directly; readiness
  # will not wait for a scheduled heartbeat in that mode.
  scheduling-enabled: true

  # How long to retain per-item ingest skip records.
  skip-retention: 30d

  # Fixed delay between polling cycles
  poll-delay: "60000"
  content-freshness-threshold: 7d

  outbox:
    # Relay scheduling and claim bounds. batch-size is clamped to 1..1000,
    # max-attempts to 1..100, initial/max backoff to 1ms..1h, and send-timeout
    # to 1ms..60s; out-of-range values are clamped at binding time.
    enabled: true
    topic: feedline.items.ingested
    poll-delay: 2000
    batch-size: 50
    max-attempts: 5
    initial-backoff-ms: 1000
    max-backoff-ms: 60000
    send-timeout-ms: 5000
    cleanup:
      enabled: true
      published-retention: 7d
      batch-size: 500
      cron: "0 0 * * * *"

  admin:
    enabled: true
    api-key: ${FEED_ADMIN_API_KEY}
    header-name: X-Admin-Token

  poller:
    lease-duration: 2m
    worker-id: ""
    # Exponential source backoff: 30s, 60s, 120s, ... capped at 1h. An upstream
    # Retry-After (bounded to 1h) is honoured when larger.
    backoff-base: 30s
    max-backoff: 1h
    # Upper bound on waiting for an in-flight poll cycle during graceful shutdown.
    shutdown-timeout: 10s

  robots:
    cache-max-entries: 256
    cache-ttl: 1h

  normalizer:
    title-max-length: 1000
    summary-max-length: 4000
    link-max-length: 1024
    guid-max-length: 512

  items:
    # Items query defaults. default-page-size is clamped to 1..max-page-size;
    # max-page-size is clamped to >=1; search-language falls back to "english".
    default-page-size: ${FEED_ITEMS_DEFAULT_PAGE_SIZE:20}
    max-page-size: ${FEED_ITEMS_MAX_PAGE_SIZE:100}
    search-language: ${FEED_ITEMS_SEARCH_LANGUAGE:english}

  # Feed sources
