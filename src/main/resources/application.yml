spring:
  application:
    name: feedline

  datasource:
    url: jdbc:postgresql://localhost:5432/feedline
    username: feedline
    password: feedline
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

feed:
  # Project URL for User-Agent header: Feedline/0.1 (+<feedline.user-agent-url>)
  user-agent-url: https://github.com/kopekijay11-hub/feedline

  # Connect and read timeouts
  connect-timeout: 5s
  read-timeout: 15s

  # Maximum response body size (5 MB default)
  max-body-bytes: 5242880

  # Minimum interval between requests to the same origin (default 1000 ms)
  per-host-interval: 1000ms

  # Maximum retries for network errors and HTTP 5xx (default 3)
  max-retries: 3

  # Maximum redirects to follow (default 3)
  max-redirects: 3

  # Fixed delay between polling cycles
  poll-delay: 60s

  # Feed sources
  sources:
    - name: CBC Top Stories
      url: https://www.cbc.ca/webfeed/rss/rss-topstories
      enabled: true
    - name: BBC News World
      url: https://feeds.bbci.co.uk/news/world/rss.xml
      enabled: true
    - name: The Verge
      url: https://www.theverge.com/rss/index.xml
      enabled: true
    - name: Google News US (Google News proxy)
      url: https://news.google.com/rss?hl=en-US&gl=US&ceid=US:en
      enabled: true
    - name: Google News CA (Google News proxy)
      url: https://news.google.com/rss?hl=en-CA&gl=CA&ceid=CA:en
      enabled: true
    - name: Google News World (Google News proxy)
      url: https://news.google.com/rss/headlines/section/topic/WORLD?hl=en-US&gl=US&ceid=US:en
      enabled: true
    - name: Yahoo News Top Stories
      url: https://news.yahoo.com/rss/topstories
      enabled: true
    - name: CNBC Top News
      url: https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=100003114
      enabled: true
    - name: MarketWatch Top Stories
      url: https://feeds.content.dowjones.io/public/rss/mw_topstories
      enabled: true
    - name: Bloomberg Markets
      url: https://feeds.bloomberg.com/markets/news.rss
      enabled: true
    - name: Investing.com News
      url: https://www.investing.com/rss/news.rss
      enabled: true
    - name: FXStreet News
      url: https://www.fxstreet.com/rss
      enabled: true
    - name: Federal Reserve Press Releases
      url: https://www.federalreserve.gov/feeds/press_all.xml
      enabled: true
    - name: Bank of Canada Press Releases
      url: https://www.bankofcanada.ca/content_type/press-releases/feed/
      enabled: true
    - name: "Yahoo Finance - Gold (GC=F)"
      url: https://feeds.finance.yahoo.com/rss/2.0/headline?s=GC=F&region=US&lang=en-US
      enabled: true
    - name: "Yahoo Finance - Silver (SI=F)"
      url: https://feeds.finance.yahoo.com/rss/2.0/headline?s=SI=F&region=US&lang=en-US
      enabled: true
    - name: "Yahoo Finance - Platinum (PL=F)"
      url: https://feeds.finance.yahoo.com/rss/2.0/headline?s=PL=F&region=US&lang=en-US
      enabled: true
    - name: "Yahoo Finance - Palladium (PA=F)"
      url: https://feeds.finance.yahoo.com/rss/2.0/headline?s=PA=F&region=US&lang=en-US
      enabled: true
    - name: "Yahoo Finance - Copper (HG=F)"
      url: https://feeds.finance.yahoo.com/rss/2.0/headline?s=HG=F&region=US&lang=en-US
      enabled: true
    - name: "Yahoo Finance - Crude Oil (CL=F)"
      url: https://feeds.finance.yahoo.com/rss/2.0/headline?s=CL=F&region=US&lang=en-US
