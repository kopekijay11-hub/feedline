services:
  postgres:
    image: postgres:16.16-alpine
    environment:
      POSTGRES_DB: feedline
      POSTGRES_USER: feedline
      POSTGRES_PASSWORD: feedline
    ports:
      - "5432:5432"
    volumes:
      - feedline_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  feedline_db_data:
